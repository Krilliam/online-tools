<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Tools - Free Developer Tools</title>
    <meta name="description" content="Collection of free online tools for developers. No login, no tracking, all calculations happen in your browser.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header"></div>

    <main>
        <section class="hero">
            <h1>Online Tools</h1>
            <p>Free tools for developers. No login, no tracking, all calculations happen in your browser.</p>
        </section>

        <!-- Search Bar -->
        <section class="search-section">
            <div class="search-wrapper">
                <input type="text" id="search-input" class="search-input" placeholder="Search tools... (e.g., sql, cron, subnet)" autocomplete="off">
                <div id="search-dropdown" class="search-dropdown" style="display: none;"></div>
            </div>
        </section>

        <!-- Category Filters -->
        <section class="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <div id="category-filters"></div>
        </section>

        <!-- Tools Grid -->
        <section id="tools-grid" class="tools-grid">
            <noscript>
                <div class="tool-card">
                    <span class="tool-category">DATABASE</span>
                    <h2>SQL Formatter</h2>
                    <p>Format complex SQL queries with JOINs and subqueries to make them readable.</p>
                    <a href="sql-formatter.html" class="tool-link">Use tool &rarr;</a>
                </div>
            </noscript>
        </section>
    </main>

    <div id="footer"></div>

    <script src="js/common.js"></script>
    <script src="js/homepage.js"></script>
</body>
</html>
